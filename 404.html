<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>GROWTAC | RUBI WORKSHOP</title>
<meta name="robots" content="noindex">
<script>
  // 하위 주소(/brake, /en/lever, /ja/kashima ...)를 원페이지 섹션으로 연결
  // github.io 미리보기(/growtac/)와 서브도메인(growtac.rubiworkshop.com/) 모두 동작
  var base = location.hostname.slice(-10) === 'github.io' ? '/growtac/' : '/';
  var parts = location.pathname.slice(base.length).replace(/\/$/, '').toLowerCase().split('/');
  var lang = (parts[0] === 'en' || parts[0] === 'ja') ? parts.shift() + '/' : '';
  var key = parts.join('/');
  var alias = { 'equal':'brake', 'brakes':'brake', 'disc':'brake', 'disc-brake':'brake', 'caliper':'brake', 'flat':'brake', 'flat-mount':'brake', 'post':'brake', 'post-mount':'brake', 'colors':'brake', 'kashima-coat':'kashima', 'levers':'lever', 'control-lever':'lever', 'shifter':'lever', 'shiftless':'lever', 'brake-lever':'lever', 'about':'brand', 'technology':'tech', 'contact':'showroom', 'dealer':'showroom', 'shop':'showroom' };
  var map = { brand:1, brake:1, tech:1, kashima:1, lever:1, showroom:1 };
  key = alias[key] || key;
  location.replace(base + lang + (map[key] ? '#' + key : ''));
</script>
<style>body{background:#f3f3f0}</style>
</head>
<body></body>
</html>
